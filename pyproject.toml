[project]
name = "agentgym-sft-training"
version = "0.1.0"
description = "AgentGym SFT Training with Qwen3-4B using TRL"
authors = [
    {name = "AgentGym Team"}
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.24.0",
    "peft>=0.7.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.1",
    "datasets>=2.14.0",
    "wandb>=0.16.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "textworld>=1.6.2",
    "beautifulsoup4>=4.14.2",
    "py4j>=0.10.9.9",
    "scienceworld>=1.2.3",
    "selenium>=4.36.0",
    "cleantext>=1.1.4",
    "rank-bm25>=0.2.2",
    "flask>=3.1.2",
    "pyserini>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
