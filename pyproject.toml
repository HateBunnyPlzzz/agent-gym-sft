[project]
name = "agentgym-gpu-training"
version = "0.1.0"
description = "AgentGym GPU Training with Qwen3 models"
authors = [
    {name = "AgentGym Team"}
]
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.14.0",
    "transformers>=4.36.0",
    "accelerate>=0.24.0",
    "torch>=2.0.0",
    "peft>=0.7.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.1",
    "matplotlib>=3.9.4",
]

[tool.setuptools]
py-modules = ["prepare_agentgym_data"]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
