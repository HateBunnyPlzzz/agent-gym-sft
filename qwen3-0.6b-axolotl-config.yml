# Axolotl Configuration for Qwen3-0.6B SFT on AgentGym
# Optimized for RTX 4000ADA 20GB VRAM - 10-15 minute smoke test

# Base model
base_model: Qwen/Qwen3-0.6B
model_type: AutoModelForCausalLM

# Dataset configuration
datasets:
  - path: agentgym_test_subset.jsonl
    type: chat_template
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    chat_template: chatml
    add_generation_prompt: true

# Training parameters for quick smoke test
sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

# LoRA configuration (memory efficient)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Fast training hyperparameters (CHOOSE ONE method)
learning_rate: 1e-4
lr_scheduler: constant
num_epochs: 1
# Option 1: Simple batch size (use this for smoke test)
batch_size: 2
# Option 2: Gradient accumulation (uncomment if you want larger effective batch)
# gradient_accumulation_steps: 8
micro_batch_size: 1

# Optimization
optimizer: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

# Memory optimization for RTX 4000ADA
gradient_checkpointing: true
bf16: true
tf32: true
flash_attention: false

# Minimal logging for smoke test
eval_steps: 25
save_steps: 50
logging_steps: 5
output_dir: ./qwen3-agentgym-smoke-test
checkpoint: false

# Tokenizer setup
tokenizer: Qwen/Qwen3-0.6B

# Single GPU setup
distributed_backend: local
ddp: false

# Data loading (minimal)
num_proc: 1
dataloader_num_workers: 1

# Reproducibility
seed: 42